# Esqueleto de CI (GitLab CI): os portões do "antes de dar algo por pronto" do
# projeto, em todo MR, em todo push na main e nas linhas de correção, e em toda tag
# de versão. Copie para .gitlab-ci.yml e troque os passos de exemplo pelos comandos
# do projeto. O equivalente no GitHub Actions é ci-github.yml.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # MR: um push novo cancela o pipeline anterior do mesmo MR.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # main, tag e linha de correção nunca são cancelados: a tag tem de apontar para
    # um commit que a CI viu passar. Troque o "v" se o prefixo da tag for outro.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH =~ /^correcao\//
      auto_cancel:
        on_new_commit: none
    # Qualquer outro push de branch fica sem pipeline próprio: quem roda é o do MR.

default:
  interruptible: true

# Lembrete, não bloqueia: mudança de comportamento vem com uma linha no CHANGELOG.
# Sai com o código 3, que o MR mostra como aviso (laranja), e não como falha.
changelog:
  image: alpine:3.22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0   # o histórico inteiro, para achar a base do MR
  allow_failure:
    exit_codes: 3
  before_script:
    - apk add --no-cache git >/dev/null
  script:
    - changed=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA")
    # Troque pelas pastas de código do projeto.
    - |
      if echo "$changed" | grep -qE '^(src|cmd|internal|web)/' \
         && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
        echo "⚠️  O código mudou e o CHANGELOG não. Se o comportamento mudou, acrescente uma linha em [Não lançado]."
        exit 3
      fi

# Exemplo para um projeto Go. Use um job por linguagem, cada um com a sua imagem
# (para Node, por exemplo: image: node:24 e npm ci && npm test).
testes:
  image: golang:1.25   # a mesma versão do go.mod
  timeout: 30 minutes
  script:
    - go vet ./...
    - go test ./...
